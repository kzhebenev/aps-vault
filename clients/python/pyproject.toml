[project]
name = "aps-vault"
version = "0.31.0"
description = "Client for APS Vault machine API (service tokens), standard library only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
authors = [{ name = "Konstantin Zhebenev" }]
keywords = ["secrets", "vault", "secret-manager", "service-token", "sealed-delivery", "gost", "ml-kem", "post-quantum"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: Security :: Cryptography",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/kzhebenev/aps-vault"
Documentation = "https://github.com/kzhebenev/aps-vault/tree/main/docs"
Source = "https://github.com/kzhebenev/aps-vault/tree/main/clients/python"
Changelog = "https://github.com/kzhebenev/aps-vault/blob/main/CHANGELOG.md"
Issues = "https://github.com/kzhebenev/aps-vault/issues"

[project.optional-dependencies]
sealed = ["cryptography>=42"]
gost = ["cryptography>=42", "gostcrypto>=1.2"]
pkcs11 = ["cryptography>=42", "python-pkcs11>=0.10"]
pqc = ["cryptography>=42", "kyber-py>=1.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["aps_vault*"]
