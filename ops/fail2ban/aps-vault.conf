# fail2ban filter for APS Vault.
# Reads the vault's security log (VAULT_SECURITY_LOG, one line per failed attempt):
#   2026-10-02 19:00:00 aps-vault auth-fail ip=203.0.113.5 kind=master
#   2026-10-02 19:00:03 aps-vault auth-fail ip=203.0.113.5 kind=token
#   2026-10-02 19:00:09 aps-vault auth-fail ip=203.0.113.5 kind=policy
# Install: cp aps-vault.conf /etc/fail2ban/filter.d/ ; see gen-jail.sh for the jail.
[Definition]
failregex = ^\S+ \S+ aps-vault auth-fail ip=<HOST> kind=\S+
ignoreregex =
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S
