[project]
name = "aps-vault-mcp"
version = "0.32.0"
description = "MCP server for APS Vault — secrets for an AI agent within its token scope."
requires-python = ">=3.10"
dependencies = [
  "mcp[cli]>=1.2.0",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
