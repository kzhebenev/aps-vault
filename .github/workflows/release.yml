# Release pipeline (0.28): runs on a version tag. Everything that can be published without a stored
# secret is — GitHub Release with assets, SBOMs and Sigstore signatures, container images on ghcr.io,
# PyPI and npm through OIDC "trusted publishing" (no tokens anywhere). Maven Central needs the two
# Sonatype secrets and a GPG key (docs/PUBLISHING.md); that job is skipped until they exist.
name: release
on:
  push:
    tags: ["v*"]

# 0.37: nothing by default; each job asks for exactly what it needs (a compromised step in one job cannot push images
# or sign with another job's rights). Third-party actions are pinned to commit SHAs (tag in the comment).
permissions: {}

env:
  PYTHON_VERSION: "3.11"

jobs:
  verify:
    name: tag matches VERSION, tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        run: |
          v=$(cat VERSION); tag=${GITHUB_REF_NAME#v}
          [ "$v" = "$tag" ] || { echo "tag v$tag does not match VERSION $v"; exit 1; }
          grep -q "VERSION = \"$v\"" backend/version.py
          grep -q "version = \"$v\"" clients/python/pyproject.toml
          grep -q "\"version\": \"$v\"" clients/node/package.json
          grep -q "<version>$v</version>" clients/java/pom.xml
          grep -q "const Version = \"$v\"" clients/go/vault.go
          grep -q "const Version = \"$v\"" clients/terraform/main.go
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && python -m pytest -q

  python:
    name: PyPI (trusted publishing)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # PyPI trusted publishing
    environment: pypi
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: pip install build twine
      - run: cd clients/python && python -m build && twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: python-dist, path: clients/python/dist/* }
      # Publishes only when PyPI knows this repository as a trusted publisher (docs/PUBLISHING.md §1);
      # until then the step fails and the rest of the release still happens.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        continue-on-error: true
        with: { packages-dir: clients/python/dist/, print-hash: true }

  node:
    name: npm (trusted publishing, provenance)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # npm trusted publishing + provenance
    environment: npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@12.2.0        # OIDC trusted publishing needs npm ≥ 11.5; 0.37: pinned, not @latest
      - run: cd clients/node && npm ci && npm run build && node --test test/client.test.mjs
      - run: cd clients/node && npm pack && mv ./*.tgz ../../aps-vault-client-node.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: node-dist, path: aps-vault-client-node.tgz }
      # Publishes only when the npm package has this workflow as a trusted publisher (docs/PUBLISHING.md §2).
      - run: cd clients/node && npm publish --provenance --access public
        continue-on-error: true

  java:
    name: Maven Central
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_CENTRAL: ${{ secrets.CENTRAL_USERNAME != '' }}     # secrets are not allowed in a step `if`; an env flag is
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - run: cd clients/java && mvn -B -q package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: java-dist, path: clients/java/target/*.jar }
      # Deploys only when the Sonatype Central token and the GPG key are in the repository secrets (docs/PUBLISHING.md §3).
      - if: env.HAS_CENTRAL == 'true'
        run: cd clients/java && mvn -B -P release deploy
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  terraform:
    name: terraform provider binaries
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version: "1.26" }
      - name: build for linux / darwin / windows, zip as the registries expect, SHA256SUMS
        run: |
          v=${{ needs.verify.outputs.version }}
          cd clients/terraform && mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/terraform-provider-apsvault_v$v$ext" .
            (cd dist && zip -q "terraform-provider-apsvault_${v}_${os}_${arch}.zip" "terraform-provider-apsvault_v$v$ext" && rm "terraform-provider-apsvault_v$v$ext")
          done
          (cd dist && sha256sum -- *.zip > "terraform-provider-apsvault_${v}_SHA256SUMS")
          printf '{"version":1,"metadata":{"protocol_versions":["6.0"]}}\n' > "dist/terraform-provider-apsvault_${v}_manifest.json"
          ls -l dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: terraform-dist, path: clients/terraform/dist/* }

  images:
    name: container images → ghcr.io (signed)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # ghcr.io
      id-token: write        # cosign keyless + attestations
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: backend
        id: backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/backend:${{ needs.verify.outputs.version }}
            ghcr.io/${{ github.repository }}/backend:latest
      - name: frontend
        id: frontend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./frontend
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ needs.verify.outputs.version }}
            ghcr.io/${{ github.repository }}/frontend:latest
      # 0.38: the update agent (agent/). Its own signature is what other agents check before replacing themselves.
      - name: updater
        id: updater
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./agent
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/updater:${{ needs.verify.outputs.version }}
            ghcr.io/${{ github.repository }}/updater:latest
      - name: sign images (Sigstore keyless, identity = this workflow)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/backend@${{ steps.backend.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository }}/frontend@${{ steps.frontend.outputs.digest }}
          cosign sign --yes ghcr.io/${{ github.repository }}/updater@${{ steps.updater.outputs.digest }}
      - name: SBOM of the images
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { image: "ghcr.io/${{ github.repository }}/backend@${{ steps.backend.outputs.digest }}", format: spdx-json, output-file: sbom-backend-image.spdx.json, upload-artifact: false }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: image-sbom, path: sbom-backend-image.spdx.json }
      # 0.36: SLSA build provenance (in-toto, Sigstore-signed, stored in GitHub's attestation store and pushed to the
      # registry next to the image) — `gh attestation verify oci://ghcr.io/kzhebenev/aps-vault/backend:<v> --owner kzhebenev`
      - name: SLSA provenance of the images
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/frontend
          subject-digest: ${{ steps.frontend.outputs.digest }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/updater
          subject-digest: ${{ steps.updater.outputs.digest }}
          push-to-registry: true
      - name: SBOM attestation of the backend image
        uses: actions/attest-sbom@bd218ad0dbcb3e146bd073d1d9c6d78e08aa8a0b # v2
        with:
          subject-name: ghcr.io/${{ github.repository }}/backend
          subject-digest: ${{ steps.backend.outputs.digest }}
          sbom-path: sbom-backend-image.spdx.json
          push-to-registry: true

  # 0.41.5: the README's path, executed on what was just published — install.sh on the release images, a secret, a
  # token, curl and `pip install aps-vault==<version>`, an encrypted backup to S3, the server lost, a fresh install
  # restored from the backup, the old token reading again, the recovery code (ops/checks/golden-path.sh, 38 checks with
  # their negatives). Not a gate for the Release (it runs after publishing); a red job here means the README lies.
  golden-path:
    name: README path on the published release
    needs: [verify, python, images]
    if: ${{ !cancelled() && needs.images.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: ops/checks/golden-path.sh "${{ needs.verify.outputs.version }}"

  release:
    name: GitHub Release — assets, SBOM, signatures
    needs: [verify, python, node, java, images, terraform]
    # a registry that is not set up yet must not cost us the Release: run as long as the tag verified
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the GitHub Release
      id-token: write        # cosign keyless + attestations
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with: { path: dist }
      - run: mkdir -p dist
      # 0.41: OpenVEX for the backend image — why the base image's unfixable Debian findings do not affect the vault
      # (ops/gen-vex.py; `trivy image --vex backend.openvex.json …`). Signed and attested with the other assets.
      - run: cp security/vex/backend.openvex.json dist/backend.openvex.json
      - name: source SBOM (backend, clients)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with: { path: ., format: spdx-json, output-file: dist/sbom-source.spdx.json, upload-artifact: false }
      # 0.36: SLSA build provenance for every release asset (before the cosign bundles are added next to them) —
      # `gh attestation verify <asset> --owner kzhebenev`
      - name: SLSA provenance of the release assets
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/**/*
            !dist/**/*.sigstore.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: sign every asset (Sigstore keyless; verify with cosign verify-blob — SECURITY.md)
        run: |
          cd dist && find . -type f ! -name '*.sigstore.json' | while read -r f; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
          find . -type f | sort
      - name: release notes from CHANGELOG
        run: |
          # 0.38: the old awk matched "## X.Y.Z" exactly, the real heading is "## X.Y.Z — date" → every release said
          # only "Release X". The shared parser (backend/changelog.py) fails when the section is missing.
          python3 ops/release-notes.py section "${{ needs.verify.outputs.version }}" > notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: notes.md
          files: |
            dist/**/*
            clients/fixtures/*.json
