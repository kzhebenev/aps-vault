<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>APS Vault</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a8b3cf' stroke-width='1.75' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='11' width='18' height='11' rx='2'/%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'/%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="/tailwind.css">
  <style>
    body { background: #0a0e1a; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif; }
    .card { background: #131826; border: 1px solid #1e2435; }
    .input { background: #0f1320; border: 1px solid #1e2435; color: #e2e8f0; }
    .input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,.2); }
    .btn-primary { background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%); }
    .btn-primary:hover { background: linear-gradient(180deg, #4592f6 0%, #2873fb 100%); }
    .btn-danger { background: #7f1d1d; color: #fecaca; }
    .btn-danger:hover { background: #991b1b; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0e1a; }
    ::-webkit-scrollbar-thumb { background: #1e2435; border-radius: 3px; }
    .blur-secret { filter: blur(5px); user-select: none; }
    .badge { font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen">
  <div id="app"></div>

  <script src="/i18n.js"></script>
