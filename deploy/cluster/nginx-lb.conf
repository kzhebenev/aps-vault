# nginx in front of the APS Vault replicas: static UI + load balancer.
# Health: a replica that fails 3 requests in 10 s is taken out for 10 s (passive check);
# /api/ready of each replica is also probed by Docker (compose healthcheck).
upstream vault_backends {
    # shared memory zone: without it every nginx worker keeps its own view of which replica is
    # down, and a lost replica is re-tried by each worker in turn (2 s connect timeout each time)
    zone vault_backends 64k;
    least_conn;
    server backend-a:8086 max_fails=1 fail_timeout=10s;
    server backend-b:8086 max_fails=1 fail_timeout=10s;
    # server backend-c:8086 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    # 0.37: security headers for the UI document and its scripts (they used to exist only on API responses, where a
    # browser does not use them): CSP script-src 'self' (no inline script), no framing (clickjacking of approve /
    # share pages and the UI), no MIME sniffing. The API responses carry the backend's own copies.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    }
    # Everything the backend serves: human + machine API, Prometheus, HashiCorp KV v2 facade.
    location ~ ^/(api/|metrics$|v1/) {
        proxy_pass http://vault_backends;
        # A lost replica's address stops answering ARP inside the Docker network — a connect
        # would hang for the default 60 s. Fail fast and retry on the other replica.
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Client-Cert-Fingerprint "";   # 0.37: never from the client; see frontend/nginx.conf.template
        client_max_body_size 25m;
    }
}
