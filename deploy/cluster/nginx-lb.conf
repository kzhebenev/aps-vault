# nginx in front of the APS Vault replicas: static UI + load balancer.
# Health: a replica that fails 3 requests in 10 s is taken out for 10 s (passive check);
# /api/ready of each replica is also probed by Docker (compose healthcheck).
upstream vault_backends {
    # shared memory zone: without it every nginx worker keeps its own view of which replica is
    # down, and a lost replica is re-tried by each worker in turn (2 s connect timeout each time)
    zone vault_backends 64k;
    least_conn;
    server backend-a:8086 max_fails=1 fail_timeout=10s;
    server backend-b:8086 max_fails=1 fail_timeout=10s;
    # server backend-c:8086 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    # Everything the backend serves: human + machine API, Prometheus, HashiCorp KV v2 facade.
    location ~ ^/(api/|metrics$|v1/) {
        proxy_pass http://vault_backends;
        # A lost replica's address stops answering ARP inside the Docker network — a connect
        # would hang for the default 60 s. Fail fast and retry on the other replica.
        proxy_connect_timeout 2s;
        proxy_read_timeout 60s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
