# A Kubernetes Secret kept in sync with APS Vault: two keys from one vault secret (its value and
# its login) plus one from another. refreshInterval is how fast a rotation (docs/ROTATION.md)
# reaches the cluster; the pods still have to pick the new Secret up (restart, reloader, or a
# library that re-reads the mounted file).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-credentials
  namespace: demo
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aps-vault
    kind: SecretStore
  target:
    name: app-credentials         # the Kubernetes Secret that is created and owned by ESO
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: db-password
        property: value
    - secretKey: DB_USER
      remoteRef:
        key: db-password
        property: login
    - secretKey: API_KEY
      remoteRef:
        key: api-key
        property: value
