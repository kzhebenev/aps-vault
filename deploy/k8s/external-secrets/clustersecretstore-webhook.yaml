# The same thing through ESO's generic "webhook" provider and APS Vault's own machine API —
# for clusters whose ESO build has the vault provider disabled, or when you want the exact
# machine-API semantics (?version=N, sealed tokens are NOT usable here: ESO cannot unseal).
# A ClusterSecretStore is cluster-wide; the token Secret then lives in the ESO namespace.
---
apiVersion: v1
kind: Secret
metadata:
  name: aps-vault-token
  namespace: external-secrets        # the namespace ESO runs in (the static manifest installs into "default")
  labels:
    external-secrets.io/type: webhook   # required: the webhook provider reads only Secrets labelled for it
type: Opaque
stringData:
  token: vlt_REPLACE_WITH_A_READ_ONLY_SERVICE_TOKEN
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aps-vault-machine-api
spec:
  provider:
    webhook:
      url: "https://vault.example.com/api/v1/m/secret/{{ .remoteRef.key }}"
      method: GET
      headers:
        Authorization: "Bearer {{ .auth.token }}"
        Accept: application/json
      secrets:
        - name: auth
          secretRef:
            name: aps-vault-token
            namespace: external-secrets
            key: token
      result:
        jsonPath: "$.{{ .remoteRef.property }}"     # value | login | notes | totp
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-credentials-webhook
  namespace: demo
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: aps-vault-machine-api
    kind: ClusterSecretStore
  target:
    name: app-credentials-webhook
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: db-password
        property: value
