# External Secrets Operator → APS Vault through the HashiCorp-compatible facade (docs/COMPATIBILITY.md).
# ESO's own "vault" provider: KV v2 reads at /v1/<folder>/data/<secret>, token checked at
# /v1/auth/token/lookup-self. Nothing APS-specific — the same store definition works against
# HashiCorp Vault or Deckhouse Stronghold later.
#
#   mount (spec.provider.vault.path)  = the APS Vault folder the service token is scoped to
#   remoteRef.key                     = the secret name
#   remoteRef.property                = value | login | notes | totp (what the token may read)
---
apiVersion: v1
kind: Secret
metadata:
  name: aps-vault-token
  namespace: demo
type: Opaque
stringData:
  token: vlt_REPLACE_WITH_A_READ_ONLY_SERVICE_TOKEN
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aps-vault
  namespace: demo
spec:
  provider:
    vault:
      server: "https://vault.example.com"
      path: "devops-demo"          # the folder
      version: "v2"
      auth:
        tokenSecretRef:
          name: aps-vault-token
          key: token
