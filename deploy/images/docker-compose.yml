# APS Vault from the release images, with the update agent (0.38). Install with ./install.sh, which writes .env.
# Settings → Updates in the vault then shows new releases and updates this installation by a click: the owner's
# request goes to the `updater` service, which checks the release and its Sigstore signatures by itself.
# Put a TLS-terminating reverse proxy in front of the frontend port.
name: ${COMPOSE_PROJECT_NAME:-aps-vault}
services:
  backend:
    image: ghcr.io/kzhebenev/aps-vault/backend:${VAULT_VERSION:?set VAULT_VERSION in .env}
    restart: unless-stopped
    volumes:
      - vault-data:/app/data       # the only state (SQLite + settings); the agent backs it up before every update
    env_file: .env
    environment:
      - VAULT_DATA_DIR=/app/data
      - VAULT_DB_PATH=/app/data/vault.db
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8086/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ghcr.io/kzhebenev/aps-vault/frontend:${VAULT_VERSION}
    restart: unless-stopped
    ports:
      - "${VAULT_BIND:-127.0.0.1}:${VAULT_PORT:-8087}:80"
    depends_on: [backend]
    environment:
      - VAULT_PASS_CERT_FINGERPRINT=${VAULT_PASS_CERT_FINGERPRINT:-0}
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "SETUID", "SETGID", "NET_BIND_SERVICE"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The update agent. It holds the Docker socket — remove this service if you update by hand
  # (docker compose pull && docker compose up -d after changing VAULT_VERSION) or with your orchestrator.
  updater:
    image: ghcr.io/kzhebenev/aps-vault/updater:${VAULT_VERSION}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      - VAULT_URL=http://backend:8086
      - VAULT_UPDATE_AGENT_TOKEN=${VAULT_UPDATE_AGENT_TOKEN:?set VAULT_UPDATE_AGENT_TOKEN in .env}
      - VAULT_INSTALL_DIR=${VAULT_INSTALL_DIR:?set VAULT_INSTALL_DIR in .env}
      - VAULT_UPDATE_CHANNEL=${VAULT_UPDATE_CHANNEL:-}
      - VAULT_UPDATE_VERIFY=${VAULT_UPDATE_VERIFY:-cosign}
      - AGENT_ID=${COMPOSE_PROJECT_NAME:-aps-vault}@${VAULT_HOST_NAME:-host}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${VAULT_INSTALL_DIR}:${VAULT_INSTALL_DIR}     # the same path inside: compose resolves it on the host
      - vault-data:/vault-data                        # backup and restore of the data around an update
    security_opt: ["no-new-privileges:true"]

volumes:
  vault-data:
